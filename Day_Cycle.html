<html>
    <head>
         <style>
            .parent{
                height:100%;
                width:100%;
                border:1px solid white;
                position: relative;
                display: flex;
                align-items:flex-end;
                justify-content: center;
                animation-name:animation ; 
                animation-iteration-count: infinite;
                animation-duration:5s;
                animation-timing-function: linear;
            }

            .child1{
                position: absolute;
                top:50%;
                left:10px;
                width:140px;
                height:140px;
                background-color: yellow;
                border-radius: 50%;
                box-shadow: 0px 0px 4px 8px yellow;
                animation-name: sun;
                animation-iteration-count: infinite;
                animation-duration:5s;
                animation-timing-function: linear;
            }

            .child2{
                height:300px;
                width:400px;
                border:2px solid brown;
                background-color: brown;
                border-radius:7px;
                display: flex;
                align-items:flex-end;
                justify-content: center;
            }
            .child3{
                height:150px;
                width:100px;
                border:2px solid gray;
                background-color: gray;
                border-radius:5px;
            }
            .child4{
                height: 100px;
                width:100%;
                border:2px solid green;
                background-color:green;
                border-radius:10px;
            }
            

            @keyframes animation {
                0%{
                    background-color:#FFB347;
                }
                50%{
                    background-color: #87CEEB;

                }
                70%{
                    background-color: #FF7E5F;
                }
                100%{
                    background-color: #0B1D51;
                }
            }

            @keyframes sun {
                /* Sunrise */
                0% {
                    top: 70%;
                    left: 5%;
                    background: darkgoldenrod;
                    box-shadow:0px 0px 4px 8px darkgoldenrod;
                }

                /* Morning */
                25% {
                    top: 35%;
                    left: 25%;
                    background: gold;
                    box-shadow:0px 0px 4px 8px gold;
                }   

                /* Noon */
                50% {
                    top: 8%;
                    left: 50%;
                    transform: translateX(-50%);
                    background: yellow;
                    box-shadow:0px 0px 4px 8px yellow;
                }

                /* Evening */
                75% {
                    top: 35%;
                    left: 75%;
                    background: orange;
                    box-shadow:0px 0px 4px 8px orange;
                }

                /* Sunset */
                100% {
                    top: 70%;
                    left: 92%;
                    background: white;
                    box-shadow:0px 0px 4px 8px white;
                }
            }
         </style>
    </head>
    
    <body>  
        <div class="parent"><div class="child1"></div>
            <div class="child2"><div class="child3"></div></div>
        </div>
        <div class="child4"></div>
    </body>
</html>
